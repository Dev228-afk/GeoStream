global:
  scrape_interval: 2s
  evaluation_interval: 2s

rule_files:
  - /etc/prometheus/alerts/geostream-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - geostream-alertmanager:9093

scrape_configs:
  - job_name: geostream-ingest-docker
    metrics_path: /metrics
    static_configs:
      - targets: ["geostream-worker:8201"]
  - job_name: geostream-ingest-host
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8201"]

