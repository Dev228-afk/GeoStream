services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: geostream-kafka
    ports:
      - "127.0.0.1:19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:19092,INTERNAL://geostream-kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_HEAP_OPTS: "-Xmx320m -Xms256m"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    container_name: geostream-postgres
    ports:
      - "127.0.0.1:5437:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geostream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geostream_local_2026}
      POSTGRES_DB: ${POSTGRES_DB:-geostream}
    volumes:
      - geostream_pg_data:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geostream} -d ${POSTGRES_DB:-geostream}"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: geostream-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "127.0.0.1:6383:6379"
    volumes:
      - geostream_redis_data:/data
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: geostream-worker
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:8201:8201"
    environment:
      KAFKA_BROKERS: geostream-kafka:9092
      DATABASE_URL: postgres://${POSTGRES_USER:-geostream}:${POSTGRES_PASSWORD:-geostream_local_2026}@geostream-postgres:5432/${POSTGRES_DB:-geostream}?sslmode=disable
      REDIS_ADDR: geostream-redis:6379
      METRICS_ADDR: 0.0.0.0:8201
      GEOSTREAM_FIXTURES_DIR: /app/fixtures
      GEOSTREAM_WORKER_POOL: "4"
      GEOSTREAM_CHANNEL_CAP: "4096"
      KAFKA_SEEK_END_ON_START: "true"
    mem_limit: 128m
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: geostream-prometheus
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:9095:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../monitoring/alerts/geostream-alerts.yml:/etc/prometheus/alerts/geostream-alerts.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=2h"
      - "--web.enable-lifecycle"
    mem_limit: 192m
    depends_on:
      alertmanager:
        condition: service_started
      worker:
        condition: service_started

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: geostream-alertmanager
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:9096:9093"
    volumes:
      - ../../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    mem_limit: 64m

  grafana:
    image: grafana/grafana:11.3.0
    container_name: geostream-grafana
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-geostream_demo_2026}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ../../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 192m
    depends_on:
      prometheus:
        condition: service_started

volumes:
  geostream_pg_data:
  geostream_redis_data:
