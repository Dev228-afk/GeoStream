apiVersion: v1
kind: Namespace
metadata:
  name: geostream
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: geostream-config
  namespace: geostream
data:
  KAFKA_BROKERS: "geostream-kafka:9092"
  REDIS_ADDR: "geostream-redis:6379"
  GEOSTREAM_WORKER_POOL: "8"
  GEOSTREAM_CHANNEL_CAP: "4096"
  GEOSTREAM_DWELL_MS: "0"
  API_ADDR: "0.0.0.0:8200"
  METRICS_ADDR: "0.0.0.0:8201"
---
apiVersion: v1
kind: Secret
metadata:
  name: geostream-secrets
  namespace: geostream
type: Opaque
stringData:
  DATABASE_URL: "postgres://geostream:REPLACE_VIA_SECRET_MANAGER@geostream-postgres:5432/geostream?sslmode=require"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: geostream-worker
  namespace: geostream
spec:
  replicas: 2
  selector:
    matchLabels:
      app: geostream-worker
  template:
    metadata:
      labels:
        app: geostream-worker
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: ghcr.io/example/geostream-worker:latest
          ports:
            - containerPort: 8201
              name: metrics
          envFrom:
            - configMapRef:
                name: geostream-config
            - secretRef:
                name: geostream-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8201
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8201
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: geostream-api
  namespace: geostream
spec:
  replicas: 2
  selector:
    matchLabels:
      app: geostream-api
  template:
    metadata:
      labels:
        app: geostream-api
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: api
          image: ghcr.io/example/geostream-api:latest
          ports:
            - containerPort: 8200
              name: http
          envFrom:
            - configMapRef:
                name: geostream-config
            - secretRef:
                name: geostream-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8200
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8200
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: geostream-api
  namespace: geostream
spec:
  selector:
    app: geostream-api
  ports:
    - port: 8200
      targetPort: 8200
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: geostream-worker-pdb
  namespace: geostream
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: geostream-worker
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: geostream-worker-hpa
  namespace: geostream
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: geostream-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

